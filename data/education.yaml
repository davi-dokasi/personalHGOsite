      - "**Thesis:** *Predictive analysis of game popularity on Steam using neural networks*, advised by Prof. João Henrique Ferreira Flores, PhD."
      - "**Statistical consulting** through NAE, the university's statistical consulting unit, as part of the Laboratory 2 course."
      - "**Courses with projects on GitHub:** Inference, Linear Models, Multivariate Analysis, Sampling, Spatial Statistics and Computational Methods."

