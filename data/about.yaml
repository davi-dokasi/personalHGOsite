# Texto da seção "Sobre" (aceita Markdown) e a ficha `davi.info()`.
bio:
  pt:
    - "Sou estudante de Estatística na **UFRGS**, com formatura prevista para dezembro de 2026. Comecei em 2019 como aprendiz de programação no Grupo RBS, já fazendo relatórios e dashboards, e desde então fui indo para onde o código encontra a estatística: análises, KPIs, dashboards e modelos preditivos, passando pela EVCOMX e pela Auroque Investimentos."
    - "Hoje estou no **Sicredi**, na área de Risco Social, Ambiental e Climático, treinando e refinando modelos de machine learning e de previsão e automatizando rotinas de análise. No TCC, investigo o que faz um jogo ser popular na Steam, com mais de 170 mil apps coletados via API."
    - "Gosto de análise reprodutível: código, texto e resultado lado a lado, para que qualquer pessoa consiga conferir como cheguei em cada número."
  en:
    - "I'm a Statistics student at **UFRGS** (Brazil), graduating in December 2026. I started in 2019 as a programming apprentice at Grupo RBS, already building reports and dashboards, and have been moving towards where code meets statistics ever since: analyses, KPIs, dashboards and predictive models, with stops at EVCOMX and Auroque Investimentos."
    - "Today I'm at **Sicredi**, in Social, Environmental and Climate Risk, training and refining machine learning and forecasting models and automating analytical routines. For my thesis, I'm investigating what makes a game popular on Steam, with more than 170k apps collected through its API."
    - "I care about reproducible analysis: code, text and results side by side, so anyone can check how I got to every number."

