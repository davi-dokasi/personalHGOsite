# Projetos. `featured` aparecem em destaque (com números), `more` em cards menores
# e `github` na lista compacta "Mais no GitHub".
# Em `stats`, `value` é numérico para ser formatado no padrão de cada idioma
# (171.769 em português, 171,769 em inglês).

featured:
  - title:
      pt: Popularidade de jogos na Steam
      en: Predicting game popularity on Steam
    kicker:
      pt: TCC · Estatística UFRGS
      en: Undergraduate thesis · UFRGS
    status:
      pt: em andamento
      en: in progress
    summary:
      pt: Pipeline completo, da coleta à modelagem, para prever quantas avaliações um jogo recebe na Steam a partir das suas próprias características, como gênero, preço, plataformas e o texto da descrição.
      en: An end-to-end pipeline, from data collection to modeling, that predicts how many reviews a Steam game gets from its own characteristics, such as genre, price, platforms and description text.
    stats:
      - value: 171769
        decimals: 0
        label:
          pt: apps coletados via Steam Web API
          en: apps collected from the Steam Web API
      - value: 0.899
        decimals: 3
        prefix: "AUC "
        label:
          pt: prever se o jogo recebe avaliação (gradient boosting)
          en: predicting whether a game gets reviews (gradient boosting)
    points:
      pt:
        - Coleta resiliente com checkpoints atômicos que retoma de onde parou; 118 mil jogos na base curada.
        - Divisão temporal entre treino e teste e modelo de barreira (hurdle) para os 20,6% de jogos sem nenhuma avaliação.
        - GLM Poisson contra Binomial Negativa (superdispersão, teste de razão de verossimilhanças). Próxima etapa, a modelagem com redes neurais (RLMP).
      en:
        - Resilient collection with atomic checkpoints that resume where they stopped; 118k games in the curated dataset.
        - Time-based train/test split and a hurdle model for the 20.6% of games with no reviews at all.
        - Poisson vs. Negative Binomial GLMs (overdispersion, likelihood-ratio test). Next step, neural network modeling (RLMP).
    tags: [Python, Jupyter, GLM, Gradient Boosting, { pt: Coleta via API, en: API data collection }]
    links:
      - kind: code
        url: https://github.com/davi-dokasi/steam-popularity-prediction

